<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Order Barang</title>

    <style>
        /* =========================
           RESET
        ========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;

            background:
                radial-gradient(circle at top left, #ffdf6b, transparent 35%),
                radial-gradient(circle at bottom right, #ff7eb3, transparent 35%),
                linear-gradient(135deg, #eef2ff, #fdf2f8);

            color: #222;
        }

        /* =========================
           CONTAINER
        ========================= */
        .container {
            max-width: 1000px;
            margin: auto;

            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);

            border-radius: 20px;
            padding: 30px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* =========================
           HEADER
        ========================= */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            color: #4f46e5;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        /* =========================
           FORM
        ========================= */
        form {
            width: 100%;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #4f46e5;
            margin-bottom: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;

            border: 2px solid #e5e7eb;
            border-radius: 10px;

            background: #fff;
            color: #222;

            font-size: 14px;

            outline: none;

            transition: 0.25s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* =========================
           CONTACT GRID
        ========================= */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* =========================
           CREDIT CARD
        ========================= */
        .card-options {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 7px;

            padding: 10px 15px;

            border: 2px solid #e5e7eb;
            border-radius: 10px;

            cursor: pointer;

            transition: 0.25s;
        }

        .radio-option:hover {
            border-color: #6366f1;
            background: #f5f3ff;
        }

        .radio-option input {
            width: auto;
        }

        /* =========================
           PRODUCT
        ========================= */
        .product-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* =========================
           BUTTON
        ========================= */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;

            margin-top: 30px;
        }

        button {
            border: none;
            padding: 13px 25px;

            border-radius: 10px;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                opacity 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .btn-submit {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;

            box-shadow:
                0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-reset {
            background: #f3f4f6;
            color: #444;
        }

        .btn-reset:hover {
            background: #e5e7eb;
        }

        /* =========================
           MESSAGE
        ========================= */
        #message {
            display: none;

            margin-top: 20px;
            padding: 15px;

            border-radius: 10px;

            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        #message.success {
            display: block;

            background: #dcfce7;
            color: #166534;

            border: 1px solid #86efac;
        }

        /* =========================
           RESPONSIVE
        ========================= */
        @media (max-width: 700px) {

            body {
                padding: 20px 10px;
            }

            .container {
                padding: 20px;
                border-radius: 15px;
            }

            .header h1 {
                font-size: 25px;
            }

            .form-grid,
            .contact-grid,
            .product-box {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <h1>FORM ORDER BARANG</h1>
            <p>Silakan isi data diri dan barang yang ingin Anda pesan.</p>
        </div>


        <form id="orderForm">

            <!-- DATA DIRI -->
            <div class="section">

                <div class="section-title">
                    👤 Data Diri
                </div>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="namaDepan">Nama Depan</label>
                        <input
                            type="text"
                            id="namaDepan"
                            placeholder="Masukkan nama depan"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="namaAkhir">Nama Akhir</label>
                        <input
                            type="text"
                            id="namaAkhir"
                            placeholder="Masukkan nama akhir"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="umur">Umur</label>
                        <input
                            type="number"
                            id="umur"
                            placeholder="Contoh: 17"
                            min="1"
                            max="100"
                            required
                        >
                    </div>

                </div>

            </div>


            <!-- KONTAK -->
            <div class="section">

                <div class="section-title">
                    📞 Bagaimana Menghubungi Anda?
                </div>

                <div class="form-group">

                    <label for="alamat">Alamat</label>

                    <textarea
                        id="alamat"
                        placeholder="Masukkan alamat lengkap..."
                        required
                    ></textarea>

                </div>

                <br>

                <div class="contact-grid">

                    <div class="form-group">
                        <label for="kota">Kota</label>

                        <input
                            type="text"
                            id="kota"
                            placeholder="Contoh: Tasikmalaya"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="telepon">No. Telepon</label>

                        <input
                            type="tel"
                            id="telepon"
                            placeholder="Contoh: 08123456789"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="negara">Negara</label>

                        <input
                            type="text"
                            id="negara"
                            value="Indonesia"
                            required
                        >
                    </div>

                </div>

            </div>


            <!-- CREDIT CARD -->
            <div class="section">

                <div class="section-title">
                    💳 Credit Card
                </div>

                <div class="card-options">

                    <label class="radio-option">
                        <input
                            type="radio"
                            name="kartu"
                            value="VISA"
                            required
                        >

                        VISA
                    </label>


                    <label class="radio-option">
                        <input
                            type="radio"
                            name="kartu"
                            value="MasterCard"
                        >

                        M/C
                    </label>

                </div>

            </div>


            <!-- BARANG -->
            <div class="section">

                <div class="section-title">
                    🛒 Barang Pesanan
                </div>

                <div class="product-box">

                    <div class="form-group">

                        <label for="barang">
                            Jenis Barang
                        </label>

                        <select id="barang" required>

                            <option value="">
                                -- Pilih Barang --
                            </option>

                            <option value="Pentium I">
                                Pentium I
                            </option>

                            <option value="Pentium II">
                                Pentium II
                            </option>

                            <option value="Pentium III">
                                Pentium III
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="jumlah">
                            Jumlah
                        </label>

                        <input
                            type="number"
                            id="jumlah"
                            min="1"
                            value="1"
                            required
                        >

                    </div>

                </div>

            </div>


            <!-- BUTTON -->
            <div class="buttons">

                <button
                    type="submit"
                    class="btn-submit"
                >
                    🚀 Kirim Data
                </button>

                <button
                    type="reset"
                    class="btn-reset"
                    id="resetButton"
                >
                    🗑️ Hapus Data
                </button>

            </div>


            <!-- MESSAGE -->
            <div id="message"></div>

        </form>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        const form = document.getElementById("orderForm");
        const message = document.getElementById("message");
        const resetButton = document.getElementById("resetButton");


        // Ketika form dikirim
        form.addEventListener("submit", function(event) {

            // Mencegah halaman refresh
            event.preventDefault();

            const namaDepan =
                document.getElementById("namaDepan").value;

            const namaAkhir =
                document.getElementById("namaAkhir").value;

            const barang =
                document.getElementById("barang").value;

            const jumlah =
                document.getElementById("jumlah").value;


            message.className = "success";

            message.innerHTML =
                `✅ Pesanan berhasil dibuat!<br>
                Terima kasih, ${namaDepan} ${namaAkhir}.<br>
                Pesanan: ${barang} (${jumlah} unit).`;

        });


        // Ketika tombol reset ditekan
        resetButton.addEventListener("click", function() {

            message.style.display = "none";

        });

    </script>

</body>

</html>
